services:
  - type: web
    name: btctool-alerts
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python alert_bot.py
    plan: free
    autoDeploy: true
    branch: main
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        value: "8922701269"
